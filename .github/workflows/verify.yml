name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify InnoSample
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tuist
        run: |
          brew tap tuist/tuist
          brew install --formula tuist

      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Run CI gate
        run: make verify-ci
