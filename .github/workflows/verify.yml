name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify InnoSample
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v4

      - name: Select the reviewed macro toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Run CI gate
        run: make verify-ci
