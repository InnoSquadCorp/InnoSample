name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify InnoSample
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v4

      - name: Select the reviewed macro toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Print tool versions
        run: |
          xcodebuild -version
          swift --version
          tuist version

      - name: Run CI gate
        env:
          UI_TEST_RUNTIME_VERSION: '27.0'
          UI_TEST_RESULT_BUNDLE: ${{ runner.temp }}/InnoSampleUI.xcresult
        run: make verify-ci

      - name: Preserve native UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InnoSample-native-UI
          path: ${{ runner.temp }}/InnoSampleUI.xcresult
          if-no-files-found: ignore
